schema_version: "1.0"
case_id: QA-0005
findings:
  - id: QA-0005-F01
    title: "modified_files のWorkspace境界が強制されていない"
    category: security-risk
    purpose_classification: spec-required
    severity: high
    severity_rationale: "仕様は列挙された各パスが対象Workspace上に存在することを要求する。実装は絶対パスをmodified_filesで明示拒否せず、相対パスもWorkspace外の既存パスを受理し得るため、修正対象の真正性を保証できない。runtime probeでWorkspace外絶対パス受理を再現した。"
    status: fixed-and-verified
    technical_disposition: fixed-and-verified
    owner_disposition: null
    first_seen_cycle: 1
    claim_refs:
      - "specs/reviewer-verification-integrity/spec.md: modified_files の存在を検証する"
      - "design.md: Decision 4 modified_files は列挙時は全実在"
    evidence:
      - type: code
        reference: "openspec/changes/spec-driven-qa-reviewer-case-lifecycle/stage/spec-driven-qa-review/lifecycle.py:84-88"
        note: "相対パスをworkspace_rootへ結合した後、p.exists()をフォールバックしておりWorkspace外境界を固定していない。絶対パスは存在すればTrueを返す。"
        revision: "unverified-no-git"
      - type: code
        reference: "openspec/changes/spec-driven-qa-reviewer-case-lifecycle/stage/spec-driven-qa-review/lifecycle.py:448-450"
        note: "modified_filesの存在確認はpath_exists_for_verifyの結果に依存し、絶対パス・親ディレクトリ脱出を拒否していない。"
        revision: "unverified-no-git"
      - type: test
        reference: "openspec/changes/spec-driven-qa-reviewer-case-lifecycle/stage/tests/test_verification_integrity.py"
        note: "欠落相対パスは検証するが、絶対パスおよび../によるWorkspace外パスの拒否テストはない。"
        revision: "unverified-no-git"
      - type: runtime-observation
        reference: "docs/ADR/QA/QA-0005-reviewer-verification-integrity-hardening/evidence/probe-workspace-escape.txt"
        note: "workspace外絶対パスのmodified_filesでverify_submissionがsuccess/verifiedになった（CONFIRMED）。"
        revision: "unverified-no-git"
    limitations:
      - "シンボリックリンク経由の脱出は未追加probe（絶対パス受理で十分に反証）。"
      - "レビューエージェントは実装にも関与（独立性 partial）。"
    requested_action: "modified_filesは絶対パスを拒否し、resolve後にworkspace_root配下であることを確認する。../、必要ならsymlinkを含む境界テストを追加し、Workspace外の既存ファイルを受理しないことを確認する。test_evidenceと同様の境界ポリシーとの整合も取る。"
    fingerprint:
      category: security-risk
      requirement_id: "modified-files-workspace-boundary"
      primary_path: "stage/spec-driven-qa-review/lifecycle.py"
      semantic_key: "modified-files-escapes-workspace"
    author_response:
      cycle: 2
      disposition: fix-submitted
      note: "Workspace境界を resolve_in_workspace で強制。cycle-02-author-response.md 参照。"
      test_evidence: "openspec/changes/reviewer-verification-integrity-hardening/evidence/pytest-after-f01-boundary.txt"
      modified_files:
        - "openspec/changes/spec-driven-qa-reviewer-case-lifecycle/stage/spec-driven-qa-review/lifecycle.py"
        - "openspec/changes/spec-driven-qa-reviewer-case-lifecycle/stage/tests/test_verification_integrity.py"
        - "openspec/changes/spec-driven-qa-reviewer-case-lifecycle/stage/MANIFEST.json"
      base_revision: "unverified-no-git"
      result_revision: "unverified-no-git"
    verification:
      cycle: 3
      result: fixed-and-verified
      verified_at: "2026-08-26T19:30:00+09:00"
      reviewer_agent_id: codex-20260826-qa0005-verification
      note: "修正後の実装を再読し、Workspace外の絶対パス・../・symlinkを拒否すること、および境界テストを含む34件の合格を確認した。"
      evidence:
        - docs/ADR/QA/QA-0005-reviewer-verification-integrity-hardening/evidence/verification-cycle03.txt
        - docs/ADR/QA/QA-0005-reviewer-verification-integrity-hardening/cycles/cycle-03-verification.md
