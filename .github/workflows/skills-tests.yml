name: skills-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "pytest==9.1.1"

      - name: Git identity for tests that create commits
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"

      - name: pr-openspec tests
        working-directory: quality-loop/skills/pr-openspec
        run: python -m pytest tests -q

      - name: spec-review-loop tests
        working-directory: quality-loop/skills/spec-review-loop
        run: python -m pytest tests -q
